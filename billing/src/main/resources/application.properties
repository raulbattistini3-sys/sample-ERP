spring.application.name=billing
# local secrets, read from billing/.env when the app runs from this folder
spring.config.import=optional:file:.env[.properties]

# 8080 is the web app in docker-compose.yml
server.port=${BILLING_PORT:8081}

# billing has its own database: never the ERP's, and never a transaction pooler (Flyway needs a session)
spring.datasource.url=${BILLING_DB_URL:jdbc:postgresql://localhost:5432/billing}
spring.datasource.username=${BILLING_DB_USERNAME:postgres}
spring.datasource.password=${BILLING_DB_PASSWORD:}

# Flyway owns the schema; JPA only checks that the entities still match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# blank values stop the app at startup (StripeProperties)
stripe.api-key=${SANDBOX_STRIPE_API_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

management.endpoints.web.exposure.include=health
