spring.application.name=billing
# local secrets, read from billing/.env when the app runs from this folder
spring.config.import=optional:file:.env[.properties]

# 8080 is the web app in docker-compose.yml
server.port=${BILLING_PORT:8081}

# The ERP's Supabase database, in a schema of its own. The URL carries the credentials and must use the
# session pooler (5432): FlywayConfig refuses the transaction pooler (6543).
spring.datasource.url=${JDBC_DATABASE_URL:}
# the session pooler has few connections, and the ERP shares them
spring.datasource.hikari.maximum-pool-size=3

# Starting the app applies pending migrations. Flyway owns the billing schema and its own history table
# there, apart from Drizzle's public tables; JPA only checks that the entities still match it.
spring.flyway.default-schema=billing
spring.flyway.schemas=billing
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=billing
spring.jpa.open-in-view=false

# blank values stop the app at startup (StripeProperties)
stripe.api-key=${SANDBOX_STRIPE_API_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# the Node API, which sends the e-mails; blank values stop the app at startup (ErpProperties)
erp.api-url=${ERP_API_URL:}
erp.internal-token=${BILLING_INTERNAL_TOKEN:}

management.endpoints.web.exposure.include=health

# Swagger UI at /docs, the OpenAPI document at /v3/api-docs
springdoc.swagger-ui.path=/docs
springdoc.paths-to-match=/webhooks/**
