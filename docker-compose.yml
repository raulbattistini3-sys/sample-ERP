# Local stack: raw Postgres + API + web + the Go spreadsheet importer. Pending api/drizzle migrations
# are applied by the one-shot "migrate" service before the API and the importer start.
#   docker compose up --build        web on http://localhost:8080, API on http://localhost:3333
#   docker compose down -v           also wipes the database volume (the init scripts run again next up)
# Optional secrets (Resend, Jira/HubSpot OAuth, ...) come from api/.env when it exists; the database,
# host/port and CORS settings below always win over it.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sample_erp
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # run once, on an empty volume: schema, then categorias + drizzle's migration log
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sample_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies the migrations the database hasn't seen, then exits. A fresh volume already has them all
  # (the init scripts record them), so this matters for a db-data volume created by an older checkout.
  migrate:
    build:
      context: ./api
      target: migrate
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/sample_erp?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./api
    env_file:
      - path: ./api/.env
        required: false
    environment:
      # the app's pool asks for SSL; sslmode=disable in the URL overrides that (plain Postgres has no TLS)
      DATABASE_URL: postgresql://postgres:postgres@db:5432/sample_erp?sslmode=disable
      APP_HOST: 0.0.0.0
      PORT: 3333
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      WEB_URL: http://localhost:8080
      API_PUBLIC_URL: http://localhost:3333
      JWT_SECRET: ${JWT_SECRET:-local-docker-only-change-me}
      # POST /products/imports hands uploaded spreadsheets to the importer over the compose network
      IMPORTER_GRPC_URL: importer:50051
    ports:
      - "3333:3333"
    depends_on:
      migrate:
        condition: service_completed_successfully
      # started, not healthy: while the importer is down the API answers 503 and the web imports
      # through POST /products/import instead, so the API never waits on it
      importer:
        condition: service_started
    restart: unless-stopped

  # Reads, validates and saves product spreadsheets in the background (importer/, proto/importador/v1),
  # taking jobs from the importacoes table in the same database.
  importer:
    build:
      context: .
      dockerfile: importer/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/sample_erp?sslmode=disable
      GRPC_PORT: 50051
      IMPORT_WORKERS: ${IMPORT_WORKERS:-2}
    # published for local tools (grpcurl -plaintext localhost:50051 list, or an API run with bun run dev);
    # it has no auth of its own and trusts its caller, so never expose it beyond your machine
    ports:
      - "${IMPORTER_PORT:-50051}:50051"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        # the browser calls the API, so this is the host-mapped address, not http://api:3333
        VITE_API_URL: http://localhost:3333
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  db-data:
