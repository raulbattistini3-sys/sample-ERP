# HTTPS only, TLS 1.3, with secrets/tls/web.crt (docker-compose.yml mounts it under /run/secrets).
# Compose publishes 443 as https://localhost:8080; the browser then calls the API at https://localhost:3333.
server {
  listen 443 ssl;
  http2 on;
  root /usr/share/nginx/html;

  ssl_certificate     /run/secrets/web_tls_cert;
  ssl_certificate_key /run/secrets/web_tls_key;
  ssl_protocols       TLSv1.3;
  ssl_session_cache   shared:SSL:1m;
  add_header Strict-Transport-Security "max-age=31536000" always;

  # client-side routes (/login, /auditorias, ...) all load index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # hashed build assets never change
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Strict-Transport-Security "max-age=31536000" always;
  }
}
