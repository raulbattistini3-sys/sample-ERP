server {
  listen 80;
  root /usr/share/nginx/html;

  # client-side routes (/login, /auditorias, ...) all load index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # hashed build assets never change
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
